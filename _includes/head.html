<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  {%- seo -%}
  {%- feed_meta -%}
  <style>
    *,:after,:before{box-sizing:border-box;padding:0}
    body{font:1rem/1.5 -apple-system,BlinkMacSystemFont,"avenir next",avenir,helvetica,"helvetica neue",ubuntu,roboto,noto,"segoe ui",arial,sans-serif;text-rendering:optimizeSpeed;background:#fff}
    main{max-width:70ch;padding:2ch;margin:auto}
    a,body{color:#353535}
    ::selection,a:focus,a:hover{background-color:#353535;color:#fff}
    .meta{margin:0 0 2.5rem}
    code,pre{color:#353535;font-family:"SF Mono",Monaco,consolas,"lucida console","dejavu sans mono",monospace;border:1px solid #353535;font-size:small}
    code{padding:.1rem;border:none}
    pre{padding:.5rem;overflow-x:auto}
    pre code{border:none}
    img{max-width:100%;height:auto;border:1px solid #353535}
    hr{background:#353535;height:1px;border:0}
    ul{list-style-type:square}
    ul,ol{padding-left:1.2rem}
    header li,footer li{display:inline}
    header a,footer a{text-decoration:none}
    header ul,footer ul{display:flex;flex-wrap:wrap;gap:0 40px}
    [aria-current=page]{font-weight:700}
    header,section,footer{padding:1rem 0}
    blockquote{border-left:5px solid #353535;padding-left:1rem;margin-left:0}
    .posts ul,header ul,footer ul{list-style:none}
    .posts,header ul,footer ul{padding:0}
    .posts li{align-items:center;display:flex;justify-content:space-between;margin-bottom:.7rem}
    .posts li a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
    .posts hr{margin:0 .5rem;height:1px;border:none;border-bottom:1px solid #353535;background:none;flex:1 0 1rem;opacity:.3}
    .posts li time{padding-left:1rem;white-space:nowrap;font-variant-numeric:tabular-nums}
    table{border-collapse:collapse;text-align:left;width:100%;display:block;overflow-x:auto}
    table th,table td{padding:10px 20px}
    footer nav ul li{font-size:.75rem;opacity:.7}
  </style>
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include analytics.html -%}
  {%- endif -%}
</head>
