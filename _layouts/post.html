---
layout: default
---
<section itemscope itemtype="https://schema.org/BlogPosting">
  <h2 itemprop="name headline">{{ page.title | escape }}</h2>
  <p class="meta">
    <time itemprop="datePublished" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {%- if page.author and page.author != site.author.name %} &bull; {{ page.author }}{% endif %}
  </p>
  <span itemprop="articleBody">
    {{ content }}
  </span>
</section>
